<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Komornik Casino Royal – prywatny klub gier, tylko żetony, tylko zabawa.">
<meta name="theme-color" content="#14050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Komornik Casino">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👑%3C/text%3E%3C/svg%3E">
<title>Komornik Casino Royal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f5c542;--gold-l:#fff1a8;--gold-d:#9a6b00;
  --red:#e11d48;--red-d:#7f1034;
  --felt:#0d3b2e;--felt-l:#14553f;
  --bg:#12040a;--panel:#1d0a14;--panel2:#2a0f1e;
  --text:#fbf6ea;--muted:#c9a9b5;
  --win:#34d399;--lose:#fb7185;--info:#7dd3fc;
  --sh:112px;
}
*{box-sizing:border-box;margin:0;padding:0}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(ellipse at 50% -10%,#4a0d24 0%,transparent 55%),
    radial-gradient(ellipse at 50% 120%,#2a0612 0%,transparent 60%),
    repeating-linear-gradient(90deg,#0000 0 38px,#ffffff06 38px 40px),
    var(--bg);
  background-attachment:fixed;
}
button{font-family:inherit}
.hidden{display:none !important}

/* ========== NEON / ŻARÓWKI ========== */
.bulbs{display:flex;justify-content:space-between;align-items:center;padding:0 8px;gap:4px}
.bulb{
  width:clamp(7px,1.6vw,11px);height:clamp(7px,1.6vw,11px);border-radius:50%;flex-shrink:0;
  background:#4a3414;box-shadow:inset 0 0 2px #0008;
  animation:flick 1.2s steps(2,end) infinite;
}
.bulb.r{background:#5a0d20;animation-name:flickR}
@keyframes flick{0%{background:#fff3b0;box-shadow:0 0 10px #ffd86b,0 0 22px #ffb300}50%{background:#4a3414;box-shadow:none}100%{background:#fff3b0;box-shadow:0 0 10px #ffd86b,0 0 22px #ffb300}}
@keyframes flickR{0%{background:#ff3b6b;box-shadow:0 0 10px #ff3b6b,0 0 22px #e11d48}50%{background:#5a0d20;box-shadow:none}100%{background:#ff3b6b;box-shadow:0 0 10px #ff3b6b,0 0 22px #e11d48}}

/* ========== SZYLD ========== */
.sign{
  position:relative;margin:14px auto 0;max-width:980px;padding:14px 16px 16px;border-radius:26px;
  background:linear-gradient(180deg,#2a0a18,#12040a 70%);
  border:3px solid var(--gold-d);
  box-shadow:0 0 0 2px #0008,0 0 40px rgba(245,197,66,.22),inset 0 0 40px rgba(225,29,72,.18);
}
.sign .bulbs{margin:2px 0}
.sign-title{text-align:center;padding:6px 0 2px}
.sign-title .big{
  font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(2.1rem,8vw,4.6rem);line-height:1;letter-spacing:clamp(2px,1vw,8px);
  background:linear-gradient(180deg,#fff7c2 0%,#f5c542 45%,#b97a00 60%,#ffe27a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a3a00) drop-shadow(0 0 16px rgba(245,197,66,.45));
}
.sign-title .sub{
  font-family:'Bebas Neue','Playfair Display',sans-serif;font-size:clamp(1rem,3.6vw,1.9rem);letter-spacing:clamp(6px,2vw,16px);
  color:#ff4d6d;text-shadow:0 0 10px #ff1f4f,0 0 22px #e11d48;margin-top:4px;
}
.sign-title .tag{
  margin-top:8px;font-size:clamp(.6rem,1.8vw,.78rem);letter-spacing:clamp(3px,1vw,6px);text-transform:uppercase;color:var(--muted);
}

/* ========== TICKER ========== */
.ticker{margin:14px auto 0;max-width:980px;overflow:hidden;border-radius:999px;background:#0b0307;border:1px solid var(--gold-d);box-shadow:inset 0 0 12px #000}
.ticker .track{display:inline-block;white-space:nowrap;padding:8px 0;animation:tick 36s linear infinite;color:var(--gold-l);font-weight:700;font-size:.9rem}
.ticker .track span{margin:0 26px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ========== TOPBAR ========== */
.topbar{
  max-width:980px;margin:14px auto 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
}
.balance{
  position:relative;display:flex;align-items:center;gap:12px;padding:10px 20px;min-width:210px;border-radius:16px;
  background:linear-gradient(180deg,#1c0710,#0a0208);border:2px solid var(--gold-d);
  box-shadow:inset 0 0 16px #000,0 0 16px rgba(245,197,66,.2);
}
.balance .lbl{font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.balance .amt{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.6rem,5vw,2.1rem);color:var(--gold-l);text-shadow:0 0 12px #f5c542;line-height:1;font-variant-numeric:tabular-nums}
.balance .coin-ico{font-size:1.3rem;margin-left:auto}
.btn{
  border:2px solid var(--gold-d);background:linear-gradient(180deg,#2d0d1d,#15060e);color:var(--text);
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s;
  box-shadow:inset 0 1px 0 #ffffff1f,0 4px 10px #0008;white-space:nowrap;
}
.btn:hover{border-color:var(--gold);color:var(--gold-l);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.on{background:linear-gradient(180deg,var(--gold-l),var(--gold) 50%,var(--gold-d));color:#1a0a00;border-color:var(--gold-l)}
.btn.bonus-ready{animation:ringGold 1.6s infinite}
.btn:disabled{opacity:.5;cursor:not-allowed;animation:none}
@keyframes ringGold{0%{box-shadow:0 0 0 0 rgba(245,197,66,.7)}100%{box-shadow:0 0 0 14px rgba(245,197,66,0)}}
.lang{display:flex;gap:4px;background:#0b0307;border:1px solid var(--gold-d);border-radius:12px;padding:4px}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:6px 9px;border-radius:9px;cursor:pointer;font-size:.8rem}
.lang button.on{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#1a0a00}
.userbox{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.userbox b{color:var(--gold-l)}

/* ========== NAV GIER ========== */
.nav{
  max-width:980px;margin:16px auto 0;display:flex;gap:8px;overflow-x:auto;padding:8px;scrollbar-width:none;
  background:linear-gradient(180deg,#1d0a14,#0b0308);border:2px solid var(--gold-d);border-radius:20px;
  box-shadow:inset 0 0 14px #000;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:1 0 auto;min-width:max-content;border:0;background:transparent;color:var(--muted);padding:12px 16px;border-radius:14px;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(1.1rem,3.5vw,1.5rem);letter-spacing:2px;cursor:pointer;transition:.25s;
}
.nav button:hover{color:var(--text);background:#ffffff08}
.nav button.on{
  background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,var(--gold-d));color:#1a0a00;
  box-shadow:0 0 18px rgba(245,197,66,.55),inset 0 2px 0 #fff8;
}

/* ========== MAIN ========== */
main{max-width:980px;margin:0 auto;padding:18px 14px 80px}
.panel{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ========== STÓŁ / PANEL GRY ========== */
.table{
  position:relative;border-radius:28px;padding:clamp(14px,3vw,24px);
  background:
    radial-gradient(ellipse at 50% 0%,var(--felt-l),var(--felt) 70%),
    var(--felt);
  border:10px solid #3a1a0c;
  box-shadow:0 0 0 3px var(--gold-d),0 20px 50px #000a,inset 0 0 60px #0008;
}
.table::before{
  content:"";position:absolute;inset:12px;border-radius:18px;border:2px dashed #f5c54255;pointer-events:none;
}
.table-title{text-align:center;font-family:'Playfair Display',serif;font-weight:900;color:var(--gold-l);font-size:clamp(1.4rem,4vw,2rem);text-shadow:0 2px 0 #000,0 0 18px rgba(245,197,66,.5);position:relative}
.table-sub{text-align:center;color:#ffffffb0;font-size:.85rem;margin-top:2px;position:relative}
.help{
  position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:#0006;color:var(--gold-l);
  font-weight:900;cursor:pointer;z-index:2;animation:ringGold 2.2s infinite;
}
.help:hover{transform:scale(1.08)}

/* ========== ŻETONY (STAWKA) ========== */
.betbar{
  margin:16px auto 0;max-width:980px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#1d0a14,#0b0308);
  border:2px solid var(--gold-d);box-shadow:inset 0 0 14px #000;
}
.betbar-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.betbar-top .lbl{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.betbar-top .val{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold-l);text-shadow:0 0 10px #f5c542}
.chips{display:flex;gap:clamp(6px,2vw,14px);justify-content:center;flex-wrap:wrap}
.chip{
  --c1:#2563eb;--c2:#1e3a8a;
  width:clamp(52px,14vw,74px);height:clamp(52px,14vw,74px);border-radius:50%;border:0;cursor:pointer;position:relative;
  color:#fff;font-weight:900;font-size:clamp(.8rem,2.6vw,1rem);
  background:
    repeating-conic-gradient(#fff 0 8deg,transparent 8deg 22.5deg),
    radial-gradient(circle,var(--c1) 55%,var(--c2) 56%);
  box-shadow:0 6px 0 var(--c2),0 10px 16px #000a,inset 0 2px 0 #fff5;
  transition:transform .2s,box-shadow .2s;
  text-shadow:0 1px 2px #000;
}
.chip span{
  display:grid;place-items:center;width:70%;height:70%;margin:15% auto;border-radius:50%;
  background:radial-gradient(circle,var(--c1),var(--c2));box-shadow:inset 0 0 0 2px #fff6;
}
.chip:hover{transform:translateY(-3px) scale(1.05)}
.chip.on{transform:translateY(-8px) scale(1.12);box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold),0 14px 18px #000b}
.chip.c10{--c1:#2563eb;--c2:#1e3a8a}
.chip.c50{--c1:#dc2626;--c2:#7f1d1d}
.chip.c100{--c1:#16a34a;--c2:#14532d}
.chip.c500{--c1:#7c3aed;--c2:#4c1d95}
.chip.c1000{--c1:#1f2937;--c2:#030712}
.chip.cmax{--c1:#f5c542;--c2:#9a6b00;color:#1a0a00}

/* ========== AUTOMAT ========== */
.cabinet{
  position:relative;max-width:620px;margin:0 auto;padding:18px 18px 22px;border-radius:30px;
  background:linear-gradient(180deg,#5b1027,#2a0612 60%,#120308);
  border:4px solid var(--gold);
  box-shadow:0 0 0 4px #2a0612,0 0 40px rgba(245,197,66,.3),inset 0 0 30px #000;
}
.cabinet-top{
  text-align:center;padding:10px 0 12px;margin-bottom:14px;border-radius:16px;
  background:linear-gradient(180deg,#fff2b0,#f5c542 40%,#b97a00);
  color:#3a1a00;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(1.3rem,5vw,2rem);letter-spacing:4px;
  box-shadow:0 4px 0 #6b4300,0 0 30px rgba(255,210,80,.6);
}
.window{
  position:relative;margin:0 auto;max-width:420px;padding:14px;border-radius:18px;background:#050205;
  border:6px solid #b97a00;box-shadow:inset 0 0 26px #000,0 0 0 2px #000;overflow:hidden;
}
.reels{display:flex;gap:10px;justify-content:center}
.reel{
  width:calc(33.3% - 7px);height:calc(var(--sh) * 1);overflow:hidden;border-radius:10px;position:relative;
  background:linear-gradient(180deg,#fff 0%,#f0e6d2 50%,#fff 100%);
  box-shadow:inset 0 0 18px #0009;
}
.strip{will-change:transform}
.sym{height:var(--sh);display:grid;place-items:center;font-size:clamp(3rem,13vw,4.6rem);line-height:1;filter:drop-shadow(0 4px 2px #0004)}
.payline{position:absolute;left:0;right:0;top:50%;height:3px;background:linear-gradient(90deg,transparent,#ff2a4d,#ff2a4d,transparent);box-shadow:0 0 10px #ff2a4d;transform:translateY(-50%);pointer-events:none;z-index:3}
.reel-shadow{position:absolute;inset:0;background:linear-gradient(180deg,#0008,transparent 22%,transparent 78%,#0008);pointer-events:none;z-index:2}
.cabinet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.win-line{
  flex:1;min-width:180px;text-align:center;padding:10px;border-radius:12px;background:#000a;border:1px solid #5a3a00;
  color:var(--gold-l);font-weight:700;font-size:.9rem;min-height:44px;display:flex;align-items:center;justify-content:center;
}
.lever{
  position:absolute;right:-22px;top:50%;width:14px;height:170px;transform-origin:bottom center;
  background:linear-gradient(90deg,#bbb,#fff,#999);border-radius:8px;transform:rotate(0deg);
  transition:transform .4s ease;cursor:pointer;
}
.lever::after{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8aa0,#e11d48 50%,#7f1034);box-shadow:0 4px 0 #5a0c22,0 8px 12px #000a}
.lever.pull{transform:rotate(38deg)}
.lever.back{transform:rotate(0deg)}
@media (max-width:640px){ .lever{right:-12px;width:10px;height:120px} .lever::after{width:32px;height:32px} }

/* ========== BIG BUTTON ========== */
.spin-btn{
  display:block;margin:16px auto 0;min-width:min(100%,280px);padding:16px 28px;border:0;border-radius:18px;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(1.5rem,5vw,2rem);letter-spacing:3px;color:#1a0a00;
  background:linear-gradient(180deg,#fff7c2,#f5c542 45%,#b97a00);
  box-shadow:0 7px 0 #6b4300,0 12px 20px #000a,inset 0 2px 0 #fffc;transition:transform .08s,box-shadow .08s,filter .2s;
  animation:breathe 2.4s ease-in-out infinite;
}
.spin-btn:hover{filter:brightness(1.07)}
.spin-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #6b4300,0 6px 10px #000a}
.spin-btn:disabled{opacity:.55;cursor:wait;animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* ========== RULETKA ========== */
.roulette-wrap{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:18px;align-items:center}
.wheel-box{position:relative;width:100%;aspect-ratio:1;max-width:260px;margin:0 auto}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:3;font-size:1.8rem;color:var(--gold-l);text-shadow:0 2px 4px #000}
.wheel{
  width:100%;height:100%;border-radius:50%;border:10px solid #5a3a00;position:relative;
  box-shadow:0 0 0 4px #000,0 0 30px rgba(245,197,66,.35),inset 0 0 20px #000;
  transition:transform 3.6s cubic-bezier(.17,.67,.12,1);
}
.wheel::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:repeating-conic-gradient(#f5c54288 0 1deg,transparent 1deg 10deg);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);pointer-events:none}
.wheel::after{content:"";position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2,#f5c542 50%,#7a5300);box-shadow:0 0 12px #000}
.ball-result{text-align:center;margin-top:10px;font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(--gold-l);min-height:34px}
.board{display:grid;gap:4px;user-select:none}
.zero{
  grid-column:1/-1;height:38px;border-radius:8px;border:2px solid #ffffff55;background:#0a7f4f;color:#fff;font-weight:900;cursor:pointer;transition:.15s;
}
.num-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.cell{
  aspect-ratio:1.1;min-height:26px;border-radius:6px;border:1px solid #ffffff44;font-weight:800;font-size:clamp(.7rem,2.2vw,.92rem);color:#fff;cursor:pointer;transition:transform .12s,box-shadow .12s;
}
.cell.red{background:linear-gradient(180deg,#e11d48,#9f1239)}
.cell.black{background:linear-gradient(180deg,#27272a,#09090b)}
.cell:hover,.zero:hover,.out:hover{transform:translateY(-2px);box-shadow:0 0 10px #fff9}
.cell.sel,.zero.sel,.out.sel{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold);transform:translateY(-2px)}
.outs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.out{
  height:44px;border-radius:8px;border:1px solid #ffffff55;background:#0003;color:#fff;font-weight:800;font-size:clamp(.66rem,2vw,.84rem);cursor:pointer;transition:.15s;
}
.out.red{background:linear-gradient(180deg,#e11d48,#9f1239)}
.out.black{background:linear-gradient(180deg,#27272a,#09090b)}
.sel-info{text-align:center;color:#ffffffd0;font-size:.85rem;margin-top:10px;min-height:20px}

/* ========== KOŚCI ========== */
.dice-stage{display:flex;justify-content:center;gap:24px;align-items:center;height:170px;perspective:600px}
.die{
  width:130px;height:130px;border-radius:24px;display:grid;place-items:center;font-size:6.2rem;line-height:1;
  background:linear-gradient(145deg,#fff,#e7dcc6);color:#111;box-shadow:inset 0 -8px 0 #0002,0 14px 24px #000a;
  transition:transform .3s;
}
.die.rolling{animation:tumble .5s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-10px)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) translateY(-10px)}100%{transform:rotate(360deg)}}
.guess-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.gbtn{
  aspect-ratio:1;border-radius:14px;border:2px solid var(--gold-d);background:linear-gradient(180deg,#2d0d1d,#15060e);color:var(--gold-l);font-family:'Bebas Neue',sans-serif;font-size:1.8rem;cursor:pointer;transition:.2s;
}
.gbtn:hover{border-color:var(--gold)}
.gbtn.on{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#1a0a00;box-shadow:0 0 14px var(--gold)}

/* ========== MONETA ========== */
.coin-stage{height:200px;display:grid;place-items:center;perspective:800px}
.coin3d{width:150px;height:150px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.3,1)}
.coin3d .face{
  position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:3.6rem;backface-visibility:hidden;
  background:radial-gradient(circle at 30% 25%,#fff7c2,#f5c542 45%,#9a6b00 100%);
  box-shadow:inset 0 0 0 8px #fff3,inset 0 0 0 12px #9a6b0088,0 0 30px rgba(245,197,66,.5);
}
.coin3d .back{transform:rotateY(180deg)}
.coin-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.coin-choice .btn{font-size:1rem;padding:16px}

/* ========== WYNIK / KOMUNIKATY ========== */
.result{
  margin:14px auto 0;max-width:620px;min-height:52px;padding:12px 16px;border-radius:14px;text-align:center;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid transparent;font-size:1rem;transition:.3s;
  font-variant-numeric:tabular-nums;
}
.result.win{background:rgba(52,211,153,.12);color:var(--win);border-color:rgba(52,211,153,.5);box-shadow:0 0 20px rgba(52,211,153,.25);animation:pop .45s}
.result.lose{background:rgba(251,113,133,.1);color:var(--lose);border-color:rgba(251,113,133,.4);animation:shake .4s}
.result.info{background:rgba(125,211,252,.08);color:var(--info);border-color:rgba(125,211,252,.35)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ========== EFEKTY WYGRANEJ ========== */
#winFx{
  position:fixed;inset:0;z-index:150;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle,rgba(245,197,66,.25),transparent 60%);
}
#winFx.show{opacity:1}
#winFx .txt{
  font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(2.2rem,11vw,5.5rem);color:var(--gold-l);text-align:center;
  text-shadow:0 4px 0 #6b4300,0 0 40px #f5c542;animation:bigIn .6s cubic-bezier(.2,1.4,.4,1) both;
}
#winFx .amt{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.6rem,6vw,2.6rem);color:#fff;text-shadow:0 0 12px #34d399;margin-top:6px}
@keyframes bigIn{0%{transform:scale(.2) rotate(-6deg);opacity:0}70%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.confetti{position:fixed;top:-12px;width:10px;height:15px;z-index:160;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r));opacity:.2}}
